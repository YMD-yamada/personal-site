  function b64ToBytes(b64){const b=atob(b64);const o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
  async function deriveKey(pin,salt){
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

  function linkify(text){
    const esc=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  }

  function clearSetupFromUrl(){

    document.getElementById("gate").classList.add("hidden");
    document.getElementById("board").classList.remove("hidden");
    document.getElementById("dock").classList.remove("hidden");
  }
  async function unlock(pin,persist){
    const md=await decrypt(pin);
    if(persist) localStorage.setItem(KEY,JSON.stringify({pin,at:Date.now()}));
    show(md);
  }
  document.getElementById("unlock").onclick=async()=>{
    const err=document.getElementById("err"); err.textContent="";
    const pin=document.getElementById("pin").value.trim();
    const persist=document.getElementById("remember").checked;
    if(!pin){err.textContent="PINを入力";return;}
    try{await unlock(pin,persist)}catch{err.textContent="PINが違います"}
  };
  document.getElementById("lock").onclick=()=>{
    localStorage.removeItem(KEY);
    sessionStorage.removeItem("mb_sess_v2");
    location.reload();
  };
  async function copy(){
    const t=extractPrompt(mdCache)||"";
    try{await navigator.clipboard.writeText(t);alert("コピーしました")}catch{prompt("コピー",t)}
  }
  document.getElementById("copy").onclick=copy;
  document.getElementById("copy2").onclick=copy;
  (async()=>{
    const setupPin=readSetupPin();
    if(setupPin){
      clearSetupFromUrl();
      try{
        await unlock(setupPin,true);
        return;
      }catch{
        document.getElementById("err").textContent="セットアップ用PINが無効です。更新後のリンクを開き直してください。";
      }
    }
    try{
      const raw=localStorage.getItem(KEY)||sessionStorage.getItem("mb_sess_v2");
      if(!raw) return;
      const {pin}=JSON.parse(raw);
      if(!pin) return;
      await unlock(pin,true);
    }catch{
      localStorage.removeItem(KEY);
      sessionStorage.removeItem("mb_sess_v2");
    }
  })();
  </script>
</body>
